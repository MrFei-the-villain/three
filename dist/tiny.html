<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three</title>
  <style>
    :root {
      --bg: #f3ede5;
      --bg-elev: #fbf7f1;
      --text: #211c17;
      --text-soft: #6a6056;
      --text-mute: #9b9085;
      --line: #e6dccf;
      --line-soft: #efe7da;
      --accent: #6f8e9b;
      --danger: #b06a5a;
      --shadow: 0 1px 2px rgba(60, 50, 40, 0.05), 0 8px 24px rgba(60, 50, 40, 0.06);
    }
    :root[data-theme="dark"] {
      --bg: #181614;
      --bg-elev: #1f1c19;
      --text: #ece6dd;
      --text-soft: #a59c91;
      --text-mute: #6c6359;
      --line: #2d2925;
      --line-soft: #252220;
      --accent: #8eb0bc;
      --danger: #c98478;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.30), 0 8px 24px rgba(0, 0, 0, 0.32);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    .tiny-head { padding: 12px 16px 8px; }
    .tiny-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-mute);
    }

    .tiny-card {
      flex: 1;
      margin: 0 12px;
      background: var(--bg-elev);
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      justify-content: center;
    }
    .tiny-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }
    .tiny-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.85; }
    .badge.plain { background: var(--line-soft); color: var(--text-soft); }
    .badge.p1 { background: #f5d8d0; color: #c2533a; }
    .badge.p2 { background: #f5e3cb; color: #d99858; }
    .badge.p3 { background: #ece1c6; color: #b8a06a; }
    .badge.p4 { background: #d8e4dc; color: #7a9988; }
    .badge.p5 { background: #d8e3e7; color: #6f8e9b; }
    :root[data-theme="dark"] .badge.p1 { background: #3a2722; color: #e07861; }
    :root[data-theme="dark"] .badge.p2 { background: #3a2e1e; color: #e0ad6e; }
    :root[data-theme="dark"] .badge.p3 { background: #35301d; color: #cfb87a; }
    :root[data-theme="dark"] .badge.p4 { background: #1f2c26; color: #9ab8a4; }
    :root[data-theme="dark"] .badge.p5 { background: #1e2c30; color: #8eb0bc; }

    .tiny-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-mute);
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .tiny-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 14px;
      gap: 8px;
    }
    .foot-btn {
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      transition: background 160ms, color 160ms, transform 160ms;
    }
    #open-btn { background: var(--text); color: var(--bg); }
    #open-btn:hover { background: var(--accent); color: #ffffff; }
    #exit-btn { color: var(--text-mute); }
    #exit-btn:hover { color: var(--danger); background: rgba(176, 106, 90, 0.10); }
    .foot-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="tiny-head"><div class="tiny-label">Most urgent</div></div>
  <div class="tiny-card" id="card"></div>
  <div class="tiny-foot">
    <button class="foot-btn" id="open-btn" type="button">Open app</button>
    <button class="foot-btn" id="exit-btn" type="button">Exit</button>
  </div>
  <script src="tiny.js"></script>
</body>
</html>
